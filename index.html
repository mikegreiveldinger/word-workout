<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column of "sticker" cards with hard ink outlines and offset shadows; coral is the only loud colour. */
:root{
  --bg:#eaf4f0; --card:#ffffff; --ink:#12233b; --muted:#56667c;
  --accent:#ff5a3c; --sun:#ffc93c; --good:#16885b; --bad:#d32f4d;
  --soft:#d9ebe4; --good-bg:#d5f3e4; --bad-bg:#fde0e5;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a2b; --card:#182840; --ink:#eef6f2; --muted:#a3b3c6;
    --accent:#ff7155; --sun:#ffc93c; --good:#4fd19b; --bad:#ff7f95;
    --soft:#22354f; --good-bg:#12402f; --bad-bg:#4a1c28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a2b; --card:#182840; --ink:#eef6f2; --muted:#a3b3c6;
  --accent:#ff7155; --sun:#ffc93c; --good:#4fd19b; --bad:#ff7f95;
  --soft:#22354f; --good-bg:#12402f; --bad-bg:#4a1c28; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:660px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,10vw,3.6rem);letter-spacing:-.02em}
h2{font-size:1.5rem}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:12px 20px;font-weight:700;font-size:1.05rem;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:.92rem;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text]{font:inherit;font-size:1.25rem;font-weight:600;width:100%;padding:13px 14px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#12233b;border:2.5px solid var(--ink);border-radius:999px;padding:5px 13px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.plain{background:var(--card);color:var(--ink)}
.hero{display:flex;flex-direction:column;gap:12px}
.hero .tilt{display:inline-block;background:var(--sun);color:#12233b;border:2.5px solid var(--ink);border-radius:12px;padding:0 10px;transform:rotate(-2deg)}
.flags{font-size:1.6rem;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.pic{display:inline-flex;align-items:center;gap:8px;padding:4px 13px 4px 4px}
.chip.pic img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;border:1.5px solid var(--ink)}
.chip small{opacity:.7;font-weight:400}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.game{text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .08s,box-shadow .08s}
.game:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.game:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.game .ico{font-size:2.3rem;line-height:1}
.game b{font-family:var(--display);font-size:1.25rem}
.game span{color:var(--muted);font-size:.93rem}
.game .best{font-size:.82rem;font-weight:700;color:var(--accent)}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.emo{font-size:4rem;line-height:1.1;text-align:center}
.de{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7vw,2.4rem);text-align:center;overflow-wrap:anywhere}
.lbl{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.fb{border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-weight:600}
.fb.good{background:var(--good-bg)} .fb.bad{background:var(--bad-bg)}
.fb .big{font-family:var(--display);font-size:1.6rem;font-weight:800;display:block}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:3px 3px 0 var(--ink)}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);opacity:.7;box-shadow:none}
.opt:disabled{cursor:default}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);text-align:center;font-weight:700}
.gap.filled{color:var(--good);border-color:var(--good)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{aspect-ratio:1/1;border:2.5px solid var(--ink);border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:clamp(.78rem,3.3vw,1rem);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink);line-height:1.15}
.mcard .q{font-family:var(--display);font-size:2rem}
.mcard.up{background:var(--card);color:var(--ink)}
.mcard.done{background:var(--good-bg);color:var(--ink);border-color:var(--good);box-shadow:none}
.mcard .e{font-size:1.5rem}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot,.tile{width:40px;height:46px;border:2.5px solid var(--ink);border-radius:10px;font-family:var(--display);font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center;background:var(--card);text-transform:lowercase;padding:0}
.slot{border-style:dashed;background:transparent}
.slot.full{border-style:solid;background:var(--sun);color:#12233b}
.slot.sp{border:none;width:14px}
.tile{box-shadow:2px 2px 0 var(--ink)}
.tile.used{visibility:hidden}
.timer{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}.bar i,.btn,.game{transition:none}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1.5px dashed var(--soft);padding-bottom:6px}
.list li b{text-align:right}
.bigscore{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;color:var(--accent)}
.reward{display:flex;gap:16px;align-items:center;background:var(--sun);color:#12233b;flex-wrap:wrap}
.reward img{width:150px;height:150px;object-fit:cover;border:2.5px solid #12233b;border-radius:14px;background:#fff;flex:none}
.reward .stack{flex:1;min-width:220px}
.reward .lbl{color:#12233b}
.reward .fact{font-size:1.12rem;font-weight:600}
.reward .btn{background:#fff;color:#12233b}
.heroimg{width:100%;max-height:260px;object-fit:cover;border:2.5px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);background:#fff}
.linkbtn{background:none;border:none;padding:0;text-decoration:underline;color:var(--muted);font-size:.9rem}
</style>
</head>

(function parse(){
  let cur = null;
  RAW.trim().split("\n").forEach(line => {
    const f = line.split("|");
    if (line[0] === "#") { cur = {id:f[0].slice(1), name:f[1], tag:f[2], n:0}; SETS.push(cur); return; }
    WORDS.push({en:f[0], de:f[1], emo:f[2], g:f[3], s:f[4], alts:f[5] ? f[5].split(",") : [], set:cur.id});
    cur.n++;
  });
})();

/* ---------- storage ---------- */
const KEY = "word-workout-v1";
let store = {last:"", players:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.players) store = s; } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
let P = null;                       // current player {score, tricky:[], best:{}, sets:[]}
function login(name){
  name = name.trim().slice(0,20);
  if (!name) return false;
  store.last = name;
  P = store.players[name] || (store.players[name] = {score:0, tricky:[], best:{}, sets:SETS.map(s=>s.id)});
  P.name = name; save(); return true;
}
function addTricky(w){ if (!P.tricky.includes(w.en)) P.tricky.push(w.en); save(); }
function dropTricky(w){ P.tricky = P.tricky.filter(x => x !== w.en); save(); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const sample = (a,n) => shuffle(a).slice(0,n);
function norm(s){
  return s.toLowerCase().replace(/[’`]/g,"'").replace(/\(.*?\)/g," ").replace(/[^a-z' ]/g," ")
    .replace(/\s+/g," ").trim().replace(/^(to|a|an|the) /,"");
}
function isRight(w, typed){ const t = norm(typed); return !!t && [w.en, ...w.alts].some(a => norm(a) === t); }
function near(a,b){ // edit distance <= 1
  a = norm(a); b = norm(b);
  if (Math.abs(a.length-b.length) > 1) return false;
  let i=0,j=0,d=0;
  while (i<a.length && j<b.length){
    if (a[i]===b[j]) { i++; j++; continue; }
    if (++d>1) return false;
    if (a.length>b.length) i++; else if (a.length<b.length) j++; else { i++; j++; }
  }
  return d + (a.length-i) + (b.length-j) <= 1;
}
function say(text){
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}
function pool(){
  let p = WORDS.filter(w => P.sets.includes(w.set) || (P.sets.includes("tricky") && P.tricky.includes(w.en)));
  return p.length >= 4 ? p : WORDS;
}
const PRAISE = ["Yes!","Spot on!","Brilliant!","Nailed it!","Correct!","Perfect!","Well done!"];
const praise = () => PRAISE[Math.floor(Math.random()*PRAISE.length)];

/* ---------- shell ---------- */
let G = null, timerId = null;
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
function header(inGame){
  return `<div class="top">
    ${inGame ? `<button class="btn ghost small" id="quit">← Games</button>` : `<span class="pill plain">👋 ${esc(P.name)}</span>`}
    <span class="pill" id="score">★ ${P.score + (G ? G.pts : 0)}</span>
  </div>`;
}
function bump(){ const s = $("#score"); if (s){ s.textContent = "★ " + (P.score + G.pts); s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop"); } }
function wireQuit(){ const q = $("#quit"); if (q) q.onclick = () => { stopTimer(); if (G && G.pts){ P.score += G.pts; save(); } G = null; home(); }; }

/* ---------- home ---------- */
const GAMES = [
  {id:"t", ico:"⌨️", name:"Translate it", desc:"See the German word, type the English one.", run:startTranslate},
  {id:"s", ico:"🎯", name:"Right sentence", desc:"Four sentences. Which one needs the word?", run:startSentence},
  {id:"m", ico:"🃏", name:"Memory match", desc:"Find the German–English pairs.", run:startMemory},
  {id:"x", ico:"🔀", name:"Letter mix", desc:"Put the mixed-up letters in order.", run:startScramble},
  {id:"b", ico:"⚡", name:"60-second blitz", desc:"How many can you get in one minute?", run:startBlitz},
];

  G = null; stopTimer();
  const n = pool().length;
  app.innerHTML = header(false) + `
  <section class="stack">
    <h2>Hi ${esc(P.name)}! Which words today?</h2>
    <div class="chips" id="sets">
      ${SETS.map(s => `<button class="chip pic" data-s="${s.id}" aria-pressed="${P.sets.includes(s.id)}">${IMG[s.id] ? `<img src="${IMG[s.id]}" alt="">` : ""}${esc(s.name)} <small>${esc(s.tag)} · ${s.n}</small></button>`).join("")}
      ${P.tricky.length ? `<button class="chip" data-s="tricky" aria-pressed="${P.sets.includes("tricky")}">🔥 My tricky words <small>${P.tricky.length}</small></button>` : ""}
    </div>
    <p class="muted" id="count">${n} words selected</p>
  </section>
  <section class="stack">
    <h2>Pick a game</h2>
    <div class="games">
      ${GAMES.map(g => `<button class="game" data-g="${g.id}"><span class="ico">${g.ico}</span><b>${g.name}</b><span>${g.desc}</span>${P.best[g.id] ? `<span class="best">Best: ★ ${P.best[g.id]}</span>` : ""}</button>`).join("")}
    </div>
  </section>
  <button class="linkbtn" id="switch">Not ${esc(P.name)}? Change player</button>`;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {

    save(); home();

  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => GAMES.find(g => g.id === b.dataset.g).run());

function frame(title, done, total, inner){
  app.innerHTML = header(true) + `
    <div class="stack">
      <div class="row between"><h2>${title}</h2><span class="muted" id="prog">${Math.min(done+1,total)} / ${total}</span></div>
      <div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div>
    </div>${inner}`;
  wireQuit();
}

/* ---------- 1. translate ---------- */
function startTranslate(){
  const q = sample(pool(), 10);
  G = {id:"t", pts:0, right:0, streak:0, missed:[], q:q.map(w => ({w, again:false})), i:0};
  askT();
}
function askT(){
  if (G.i >= G.q.length) return results();
  const {w, again} = G.q[G.i];
  let phase = "ask", hinted = false;
  frame("Translate it", G.i, G.q.length, `
    <form class="card stack" id="f">
      <div class="emo">${w.emo}</div>
      <div><div class="lbl">${again ? "Once more · German" : "German"}</div><div class="de">${esc(w.de)}</div></div>
      <label class="lbl" for="ans">English</label>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the English word">
      <div id="fb"></div>
      <div class="row between">
        <button type="button" class="btn ghost small" id="hint">💡 Hint</button>
        <button class="btn" type="submit" id="go">Check</button>
      </div>
    </form>`);
  const inp = $("#ans"), fb = $("#fb");
  inp.focus();
  $("#hint").onclick = () => {
    hinted = true;
    const mask = w.en.split("").map((c,i) => (c===" " ? "  " : i===0 ? c : "_")).join(" ");
    fb.innerHTML = `<div class="fb">Starts with <b>${esc(w.en[0])}</b> · <span style="letter-spacing:.1em">${esc(mask)}</span></div>`;
    inp.focus();
  };
  $("#f").onsubmit = e => {
    e.preventDefault();
    if (phase === "done") return;
    const typed = inp.value;
    if (!typed.trim()) { inp.focus(); return; }
    if (isRight(w, typed)) {
      let gain;
      if (phase === "ask") {
        gain = again ? 5 : hinted ? 6 : 10;
        if (!again) { G.right++; G.streak++; if (G.streak >= 3 && !hinted) gain += 2; if (!hinted) dropTricky(w); }
      } else gain = 2;
      G.pts += gain; bump(); phase = "done";
      fb.innerHTML = `<div class="fb good"><span class="big">${praise()} +${gain}</span>${esc(w.de)} = <b>${esc(w.en)}</b>${G.streak >= 3 && gain > 10 ? " · 🔥 streak bonus" : ""}</div>`;
      inp.disabled = true; $("#hint").disabled = true;
      setTimeout(() => { G.i++; askT(); }, 1100);
    } else if (phase === "ask") {
      phase = "retry"; G.streak = 0;
      if (!G.missed.includes(w)) G.missed.push(w);
      addTricky(w);
      if (!again) G.q.push({w, again:true});
      fb.innerHTML = `<div class="fb bad">${near(typed, w.en) ? "So close, check the spelling." : "Not quite."} The English word is
        <span class="big">${esc(w.en)} <button type="button" class="btn ghost small" id="spk">🔊</button></span>
        Now type it yourself.</div>`;
      $("#spk").onclick = () => { say(w.en); inp.focus(); };
      say(w.en);
      inp.value = ""; inp.placeholder = "Type: " + w.en; $("#go").textContent = "Try again"; $("#hint").disabled = true;
      inp.focus(); $("#f").classList.add("shake"); setTimeout(() => $("#f") && $("#f").classList.remove("shake"), 400);
    } else {
      inp.value = ""; inp.focus();
      $("#f").classList.remove("shake"); void $("#f").offsetWidth; $("#f").classList.add("shake");
    }
  };
}

/* ---------- 2. right sentence ---------- */
function startSentence(){
  G = {id:"s", pts:0, right:0, missed:[], q:sample(pool(), 8), i:0};
  askS();
}
function askS(){
  if (G.i >= G.q.length) return results();
  const w = G.q[G.i];
  const others = shuffle(WORDS.filter(o => o.g !== w.g));
  const pick = [], seen = new Set();
  for (const o of others){ if (!seen.has(o.g)){ seen.add(o.g); pick.push(o); } if (pick.length === 3) break; }
  for (const o of others){ if (pick.length >= 3) break; if (!pick.includes(o)) pick.push(o); }
  const opts = shuffle([w, ...pick]);
  let tries = 0, done = false;
  const gapHtml = s => esc(s).replace("___", `<span class="gap">&nbsp;</span>`);
  frame("Right sentence", G.i, G.q.length, `
    <div class="card stack">
      <div class="lbl">Which sentence needs this word?</div>
      <div class="de">${w.emo} ${esc(w.en)}</div>
      <div class="lbl" style="text-transform:none;letter-spacing:0">${esc(w.de)}</div>
    </div>
    <div class="stack" id="opts">${opts.map((o,i) => `<button class="opt" data-i="${i}">${gapHtml(o.s)}</button>`).join("")}</div>
    <div id="fb"></div>`);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (done) return;
    const o = opts[+b.dataset.i];
    if (o === w) {
      done = true;
      const gain = [10,5,2,0][tries];
      if (tries === 0) { G.right++; }
      G.pts += gain; bump();
      b.classList.add("good");
      b.innerHTML = esc(w.s).replace("___", `<span class="gap filled">${esc(w.en)}</span>`);
      app.querySelectorAll(".opt").forEach(x => x.disabled = true);
      $("#fb").innerHTML = `<div class="row between"><div class="fb good" style="flex:1"><b>${tries ? "Got it." : praise()} +${gain}</b></div><button class="btn" id="next">Next →</button></div>`;
      $("#next").onclick = () => { G.i++; askS(); };
      $("#next").focus();
    } else {
      tries++;
      if (!G.missed.includes(w)) G.missed.push(w);
      addTricky(w);
      b.classList.add("bad"); b.disabled = true;
      $("#fb").innerHTML = `<div class="fb bad">“${esc(w.en)}” doesn't fit there. Read the others and try again.</div>`;
    }
  });
}

/* ---------- 3. memory ---------- */
function startMemory(){
  const fits = w => w.en.length <= 16 && w.de.length <= 24;
  const src = pool().filter(fits);
  const ws = sample(src.length >= 6 ? src : WORDS.filter(fits), 6);
  const cards = shuffle(ws.flatMap(w => [{w, k:"de"}, {w, k:"en"}]));
  G = {id:"m", pts:0, right:0, missed:[], total:6, moves:0, found:0, cards, open:[], lock:false};
  frame("Memory match", 0, 6, `<p class="muted">Turn two cards. A German word and its English partner make a pair.</p><div class="mem" id="mem"></div>`);
  $("#prog").textContent = "0 / 6 pairs";
  drawM();
}
function drawM(){
  $("#mem").innerHTML = G.cards.map((c,i) => {
    const up = c.done || G.open.includes(i);
    return `<button class="mcard ${c.done ? "done" : up ? "up" : ""}" data-i="${i}" ${c.done ? "disabled" : ""} aria-label="${up ? esc(c.k==="de"?c.w.de:c.w.en) : "Hidden card"}">
      ${up ? (c.k === "de" ? `<span>🇩🇪</span>${esc(c.w.de)}` : `<span class="e">${c.w.emo}</span>${esc(c.w.en)}`) : `<span class="q">?</span>`}</button>`;
  }).join("");
  app.querySelectorAll(".mcard").forEach(b => b.onclick = () => flipM(+b.dataset.i));
}
function flipM(i){
  if (G.lock || G.open.includes(i) || G.cards[i].done) return;
  G.open.push(i); drawM();
  if (G.open.length < 2) return;
  G.moves++;
  const [a,b] = G.open.map(x => G.cards[x]);
  if (a.w === b.w && a.k !== b.k) {
    a.done = b.done = true; G.open = []; G.found++; G.right++;
    say(a.w.en);
    $("#prog").textContent = G.found + " / 6 pairs";
    $(".bar i").style.width = Math.round(G.found/6*100) + "%";
    drawM();
    if (G.found === 6) { G.pts = Math.max(20, 100 - (G.moves - 6) * 5); bump(); setTimeout(results, 900); }
  } else {
    G.lock = true;
    setTimeout(() => { if (!G || G.id !== "m") return; G.open = []; G.lock = false; drawM(); }, 1000);
  }
}

/* ---------- 4. letter mix ---------- */
function startScramble(){
  const ok = pool().filter(w => { const n = w.en.replace(/ /g,"").length; return n >= 3 && n <= 13; });
  G = {id:"x", pts:0, right:0, missed:[], q:sample(ok.length >= 4 ? ok : WORDS.filter(w => w.en.length <= 9), 8), i:0};
  askX();
}
function askX(){
  if (G.i >= G.q.length) return results();
  const w = G.q[G.i];
  const target = w.en.toLowerCase().replace(/ /g,"").split("");
  let tiles = shuffle(target);
  if (tiles.join("") === target.join("")) tiles = tiles.reverse();
  let placed = [], fails = 0, done = false;   // placed = tile indexes
  frame("Letter mix", G.i, G.q.length, `
    <div class="card stack" id="box">
      <div class="emo">${w.emo}</div>
      <div><div class="lbl">German</div><div class="de">${esc(w.de)}</div></div>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <div id="fb"></div>
      <div class="row between"><button class="btn ghost small" id="clr">↺ Clear</button><span class="muted">Tap the letters in the right order</span></div>
    </div>`);
  function draw(){
    let k = 0, h = "";
    for (const ch of w.en){
      if (ch === " ") { h += `<span class="slot sp"></span>`; continue; }
      const t = placed[k];
      h += `<button class="slot ${t !== undefined ? "full" : ""}" data-k="${k}" aria-label="letter ${k+1}">${t !== undefined ? esc(tiles[t]) : ""}</button>`;
      k++;
    }
    $("#slots").innerHTML = h;
    $("#tiles").innerHTML = tiles.map((c,i) => `<button class="tile ${placed.includes(i) ? "used" : ""}" data-t="${i}">${esc(c)}</button>`).join("");
    app.querySelectorAll(".tile").forEach(b => b.onclick = () => { if (done || placed.length >= target.length) return; placed.push(+b.dataset.t); draw(); check(); });
    app.querySelectorAll(".slot.full").forEach(b => b.onclick = () => { if (done) return; placed = placed.slice(0, +b.dataset.k); draw(); });
  }
  function check(){
    if (placed.length < target.length) return;
    if (placed.map(i => tiles[i]).join("") === target.join("")) {
      done = true;
      const gain = fails ? 3 : 10;
      if (!fails) G.right++;
      G.pts += gain; bump(); say(w.en);
      $("#fb").innerHTML = `<div class="fb good"><span class="big">${praise()} +${gain}</span>${esc(w.de)} = <b>${esc(w.en)}</b></div>`;
      setTimeout(() => { G.i++; askX(); }, 1200);
    } else {
      fails++;
      if (!G.missed.includes(w)) G.missed.push(w);
      addTricky(w);
      $("#fb").innerHTML = `<div class="fb bad">Not quite. The word is <span class="big">${esc(w.en)}</span>Now build it yourself.</div>`;
      $("#box").classList.remove("shake"); void $("#box").offsetWidth; $("#box").classList.add("shake");
      placed = []; draw();
    }
  }
  $("#clr").onclick = () => { if (!done) { placed = []; draw(); } };
  draw();
}

/* ---------- 5. blitz ---------- */
function startBlitz(){
  G = {id:"b", pts:0, right:0, missed:[], n:0, t:60, deck:shuffle(pool()), lock:false, seen:[]};
  app.innerHTML = header(true) + `
    <div class="row between"><h2>60-second blitz</h2><span class="timer" id="time">⏱ 60</span></div>
    <div class="bar"><i id="tb" style="width:100%"></i></div>
    <div class="card stack"><div class="emo" id="be"></div><div class="de" id="bd"></div></div>
    <div class="grid2" id="bo"></div>`;
  wireQuit();
  timerId = setInterval(() => {
    G.t--; $("#time").textContent = "⏱ " + G.t; $("#tb").style.width = (G.t/60*100) + "%";
    if (G.t <= 0) { stopTimer(); results(); }
  }, 1000);
  askB();
}
function askB(){
  if (!G.deck.length) G.deck = shuffle(pool());
  const w = G.deck.pop(); G.seen.push(w);
  const same = shuffle(WORDS.filter(o => o !== w && o.g === w.g && norm(o.en) !== norm(w.en)));
  const rest = shuffle(WORDS.filter(o => o !== w && o.g !== w.g));
  const opts = shuffle([w, ...same.slice(0,2), ...rest].slice(0,4));
  $("#be").textContent = w.emo; $("#bd").textContent = w.de;
  $("#bo").innerHTML = opts.map((o,i) => `<button class="opt" data-i="${i}">${esc(o.en)}</button>`).join("");
  G.lock = false; G.n++;
  app.querySelectorAll("#bo .opt").forEach(b => b.onclick = () => {
    if (G.lock) return; G.lock = true;
    if (opts[+b.dataset.i] === w) {
      b.classList.add("good"); G.right++; G.pts += 5; bump();
      setTimeout(() => { if (G && G.id === "b" && timerId) askB(); }, 250);
    } else {
      b.classList.add("bad");
      app.querySelectorAll("#bo .opt").forEach(x => { if (opts[+x.dataset.i] === w) x.classList.add("good"); });
      if (!G.missed.includes(w)) G.missed.push(w);
      addTricky(w);
      setTimeout(() => { if (G && G.id === "b" && timerId) askB(); }, 1300);
    }
  });

const FACTS = {
w:[
 ["British custom","In Britain, Mother's Day is called Mothering Sunday. It is in spring, three weeks before Easter, so British mums get their flowers long before mums in Luxembourg do."],
 ["Autumn or fall?","British people say “autumn”, Americans say “fall”. “Fall” is short for an old English expression, “the fall of the leaf”."],
 ["A saying to keep","“Blood is thicker than water.” English speakers say this when they mean that family comes first."],
 ["Mum or mom?","In Britain you write “mum”, in the USA “mom”. In the north of England you will even hear “mam”."]],
a:[
 ["British custom","A “full English breakfast” is a big plate of eggs, bacon, sausages, baked beans, tomatoes, mushrooms and toast. Most people only have time for it at the weekend."],
 ["Tea is not always a drink","In many parts of Britain, especially the north, the evening meal is called “tea”. So “What's for tea?” can mean “What are we having for dinner?”"],
 ["A saying to keep","“Early to bed and early to rise makes a man healthy, wealthy and wise.” This old proverb is more than 300 years old."],
 ["Football history","The modern rules of football were written down in London in 1863, when the Football Association was founded. That is why England is called the home of football."]],
b:[
 ["British custom","Most pupils in Britain wear a school uniform, often with a blazer and a tie in the school colours."],
 ["Transport history","The London Underground opened in 1863 and is the oldest underground railway in the world. Londoners simply call it “the Tube”."],
 ["On the road","In Britain cars drive on the left, so remember to look right first before you cross the street. In London it is even painted on the road: “LOOK RIGHT”."],
 ["Maths or math?","British pupils do “maths”, American students do “math”. Both are short for “mathematics”."]],
c:[
 ["Careful with this word","In Britain a “rubber” removes pencil marks. In the USA the same thing is called an “eraser”."],
 ["Dictionary history","The first complete Oxford English Dictionary was finished in 1928. The project had been started more than 70 years earlier, in 1857."],
 ["Pencil history","There is no lead in a “lead pencil”. The dark part is graphite, and pencil-making began after a large graphite deposit was found in the Lake District in England in the 1500s."],
 ["Clock fact","Big Ben is the name of the great bell, not the clock or the tower. Since 2012 the tower has been called the Elizabeth Tower."]],
d:[
 ["Theatre history","In Shakespeare's time, about 400 years ago, women were not allowed to act. All the female roles at the Globe Theatre in London were played by boys and men."],
 ["An idiom to keep","“It's not my cup of tea” means “I don't really like it”. Example: “Rock climbing is not my cup of tea, but I love swimming.”"],
 ["Tennis tradition","Wimbledon is the oldest tennis tournament in the world. It was first played in 1877, and the players still have to wear almost completely white clothes."],
 ["Skateboarding","Skateboarding became an Olympic sport at the Tokyo Games in 2021. British skater Sky Brown won a bronze medal there when she was only 13."]],
e:[
 ["Music history","The saxophone is named after its inventor, Adolphe Sax. He came from Belgium, not far from Luxembourg, and invented it in the 1840s."],
 ["Word history","“Piano” is short for the Italian “pianoforte”, which means “soft-loud”. It was the first keyboard instrument that could play both quietly and loudly."],
 ["Sport history","Rugby is named after Rugby School in England. The legend says that in 1823 a pupil called William Webb Ellis picked up the ball during a football game and ran with it."],
 ["Idioms to keep","“As quiet as a mouse” means very quiet. And when something is very easy, British children say “easy-peasy”."]],
f:[
 ["British custom","A top-level cricket match can last up to five days. The players stop for lunch and also for a tea break in the afternoon."],
 ["Word history","Badminton is named after Badminton House, a large country house in England where the game was played in the 1870s."],
 ["Sport history","Volleyball was invented in the USA in 1895 by William G. Morgan. At first he called it “Mintonette”."],
 ["Careful with this word","In Britain “hockey” is played on grass with a small ball. If you mean the game on ice, say “ice hockey”."]]
};
function reward(words){
  const count = {};
  words.forEach(w => count[w.set] = (count[w.set] || 0) + 1);
  const set = Object.keys(count).sort((a,b) => count[b] - count[a])[0] || "w";
  P.seen = P.seen || [];
  let list = FACTS[set].map((f,i) => ({f, k:set+i})), fresh = list.filter(x => !P.seen.includes(x.k));
  if (!fresh.length){ P.seen = P.seen.filter(k => k[0] !== set); fresh = list; }
  const pick = fresh[Math.floor(Math.random()*fresh.length)];
  P.seen.push(pick.k); save();
  return `<section class="card reward">
    ${IMG[set] ? `<img src="${IMG[set]}" alt="">` : ""}
    <div class="stack"><div class="lbl" style="text-align:left">🎁 Your reward · ${esc(pick.f[0])}</div>
    <p class="fact">${esc(pick.f[1])}</p>
    <button class="btn ghost small" id="hear" style="align-self:flex-start">🔊 Listen</button></div>
  </section>`;
}

/* ---------- results ---------- */
function results(){
  stopTimer();
  const g = G, game = GAMES.find(x => x.id === g.id);
  const used = g.id === "t" ? g.q.map(x => x.w) : g.id === "m" ? g.cards.map(c => c.w) : g.id === "b" ? g.seen : g.q;
  const gift = reward(used);
  P.score += g.pts;
  const record = g.pts > (P.best[g.id] || 0);
  if (record) P.best[g.id] = g.pts;
  save();
  const total = g.id === "b" ? g.n - 1 : g.id === "m" ? 6 : (g.id === "t" ? g.q.filter(x => !x.again).length : g.q.length);
  const ratio = total ? g.right / total : 0;
  const line = g.id === "m" ? `All 6 pairs in ${g.moves} turns.`
    : g.id === "b" ? `${g.right} right in 60 seconds.`
    : `${g.right} of ${total} right first time.`;
  const mood = g.id === "m" ? (g.moves <= 10 ? "🏆" : "👏") : ratio >= .9 ? "🏆" : ratio >= .6 ? "👏" : "💪";
  const msg = mood === "🏆" ? `Fantastic, ${esc(P.name)}!` : mood === "👏" ? `Good work, ${esc(P.name)}!` : `Keep going, ${esc(P.name)}!`;
  G = null;
  app.innerHTML = header(false) + `
    <section class="card stack" style="text-align:center">
      <div class="emo">${mood}</div>
      <h2>${msg}</h2>
      <div class="bigscore">+${g.pts}</div>
      <p>${line}${record ? " <b>New best score!</b>" : ""}</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="again">Play again</button>
        <button class="btn ghost" id="home">Other games</button>
      </div>
    </section>
    ${gift}
    ${g.missed.length ? `<section class="card stack"><h2>Words to look at again</h2>
      <ul class="list">${g.missed.map(w => `<li><span>${w.emo} ${esc(w.de)}</span><b>${esc(w.en)}</b></li>`).join("")}</ul>
      <p class="muted">They are saved under “My tricky words” so you can practise just these.</p></section>` : ""}`;
  $("#hear").onclick = () => say(document.querySelector(".fact").textContent);
  $("#again").onclick = game.run;
  $("#home").onclick = home;
}

welcome();
</script>
